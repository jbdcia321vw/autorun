name: build-autorun

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore: [ '**.md' ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Fail fast if the patch is missing
        run: |
          if grep -q "second open shares an existing descriptor" dlls/ntdll/unix/horizon.c; then
            echo "dup patch present (shared descriptor)"
          elif grep -q "open_errno == EINVAL" dlls/ntdll/unix/horizon.c; then
            echo "read-only retry present"
          else
            echo "::error::horizon.c has no autorun patch (neither dup nor read-only retry)"
            grep -n "fd = open( filename, flags, 0666 );" dlls/ntdll/unix/horizon.c || true
            exit 1
          fi

      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y make bison python3 curl unzip

      # package-autorun.py hardcodes the author's macOS llvm-mingw directory.
      - name: Alias the llvm-mingw toolchain name
        run: |
          mkdir -p horizon-wine/toolchains
          cd horizon-wine/toolchains
          ln -sfn llvm-mingw-20260505-ucrt-ubuntu-22.04-x86_64 \
                  llvm-mingw-20260505-ucrt-macos-universal

      # The build container runs as root, so the tree must be root-owned while
      # it runs; tee therefore runs as root too, and the tree is handed back to
      # the runner user afterwards whatever happens.
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          sudo chown -R root:root .
          sudo git config --global --add safe.directory '*'
          rc=0
          sudo sh build.sh --jobs 4 2>&1 | sudo tee build.log > /dev/null || rc=$?
          sudo chown -R "$(id -u):$(id -g)" .
          echo "build.sh exit code: $rc"
          exit $rc

      - name: Show what was produced
        if: always()
        run: |
          echo "--- build-autorun ---"
          ls -l horizon-wine/build-autorun 2>/dev/null || echo "(none)"
          echo "--- build-switch-amd64 ---"
          ls -l horizon-wine/build-switch-amd64/*.zip 2>/dev/null || echo "(none)"
          echo "--- log tail ---"
          tail -n 60 build.log 2>/dev/null || echo "(no build.log)"

      - name: Stage the package
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/art"
          cp -v horizon-wine/build-autorun/*.zip "$RUNNER_TEMP/art/" 2>/dev/null || true
          cp -v horizon-wine/build-switch-amd64/*.zip "$RUNNER_TEMP/art/" 2>/dev/null || true
          ls -l "$RUNNER_TEMP/art"

      - name: Upload package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autorun-package
          path: ${{ runner.temp }}/art/*.zip
          if-no-files-found: warn

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
