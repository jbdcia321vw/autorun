name: build-autorun

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore: [ '**.md' ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Fail fast if the patch is missing
        run: |
          if grep -q "rw_mode != O_RDONLY" server/fd.c; then
            echo "patch present"
          else
            echo "::error::server/fd.c does not contain the read-only fallback patch"
            exit 1
          fi

      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y make bison python3 curl unzip

      # package-autorun.py hardcodes the author's macOS llvm-mingw directory.
      - name: Alias the llvm-mingw toolchain name
        run: |
          mkdir -p horizon-wine/toolchains
          cd horizon-wine/toolchains
          ln -sfn llvm-mingw-20260505-ucrt-ubuntu-22.04-x86_64 \
                  llvm-mingw-20260505-ucrt-macos-universal

      # The build container runs as root; the checkout is owned by the runner
      # user, so git inside the container refuses the vendored repos.
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          sudo chown -R root:root .
          sudo git config --global --add safe.directory '*'
          sudo sh build.sh --jobs 4 2>&1 | tee build.log

      - name: Hand the tree back to the runner user
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" . || true

      - name: Show what was produced
        if: always()
        run: |
          echo "--- build-autorun ---"
          ls -l horizon-wine/build-autorun 2>/dev/null || echo "(none)"
          echo "--- build-switch-amd64 ---"
          ls -l horizon-wine/build-switch-amd64/*.zip 2>/dev/null || echo "(none)"
          echo "--- log tail ---"
          tail -n 40 build.log 2>/dev/null || echo "(no build.log)"

      # Upload the archives as they are; no extraction step to fail.
      - name: Upload package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autorun-package
          path: |
            horizon-wine/build-autorun/*.zip
            horizon-wine/build-switch-amd64/*.zip
          if-no-files-found: warn

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
