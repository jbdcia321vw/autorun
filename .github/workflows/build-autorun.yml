name: build-autorun

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore: [ '**.md' ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Fail fast if the patch is missing
        run: |
          if grep -q "rw_mode != O_RDONLY" server/fd.c; then
            echo "patch present"
          else
            echo "::error::server/fd.c does not contain the read-only fallback patch"
            exit 1
          fi

      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y make bison python3 curl unzip

      # package-autorun.py hardcodes the author's macOS llvm-mingw directory;
      # point that name at the Linux toolchain build.sh downloads.
      - name: Alias the llvm-mingw toolchain name
        run: |
          mkdir -p horizon-wine/toolchains
          cd horizon-wine/toolchains
          ln -sfn llvm-mingw-20260505-ucrt-ubuntu-22.04-x86_64 \
                  llvm-mingw-20260505-ucrt-macos-universal
          ls -la

      # The build container runs as root; the checkout is owned by the runner
      # user, so git inside the container refuses the vendored repos.
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          sudo chown -R root:root .
          sudo git config --global --add safe.directory '*'
          sudo sh build.sh --jobs 4 2>&1 | tee build.log

      - name: Hand the tree back to the runner user
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" .

      - name: Tail of the log on failure
        if: failure()
        run: tail -n 150 build.log || true

      - name: Find and extract the runtime
        if: always()
        shell: bash
        run: |
          set -e
          mkdir -p out
          ZIP=$(ls -t horizon-wine/build-autorun/autorun-*.zip 2>/dev/null | head -1 || true)
          if [ -z "$ZIP" ]; then
            ZIP=$(ls -t horizon-wine/build-switch-amd64/*.zip 2>/dev/null | head -1 || true)
            echo "packaging did not finish; using the raw runtime zip"
          fi
          if [ -z "$ZIP" ]; then
            echo "::error::no zip produced"
            ls -la horizon-wine | head -40
            exit 1
          fi
          echo "using $ZIP"
          unzip -q -o "$ZIP" -d out
          NRO=$(find out -name 'wine-nx-runtime.nro' | head -1)
          if [ -z "$NRO" ]; then
            echo "::error::wine-nx-runtime.nro not found inside $ZIP"
            find out -maxdepth 3 | head -60
            exit 1
          fi
          echo "found: $NRO"
          mkdir -p runtime
          cp "$NRO" runtime/wine-nx-runtime.nro
          ls -l runtime/

      - name: Upload runtime
        uses: actions/upload-artifact@v4
        with:
          name: wine-nx-runtime-nro
          path: runtime/wine-nx-runtime.nro
          if-no-files-found: error

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build.log
          if-no-files-found: warn
