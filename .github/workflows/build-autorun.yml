name: build-autorun

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore: [ '**.md' ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Fail fast if the patch is missing
        run: |
          if grep -q "rw_mode != O_RDONLY" server/fd.c; then
            echo "patch present"
          else
            echo "::error::server/fd.c does not contain the read-only fallback patch"
            exit 1
          fi

      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y make bison python3 curl unzip

      # The build container runs as root; the checkout is owned by the runner
      # user, so git inside the container refuses the vendored repos
      # ("dubious ownership").  Build as root, then return the tree.
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          sudo chown -R root:root .
          sudo git config --global --add safe.directory '*'
          sudo sh build.sh --jobs 4 2>&1 | tee build.log

      - name: Hand the tree back to the runner user
        if: always()
        run: |
          sudo chown -R "$(id -u):$(id -g)" .
          ls -la horizon-wine | head -30 || true

      - name: Tail of the log on failure
        if: failure()
        run: tail -n 120 build.log || true

      - name: Find and extract the runtime
        if: success()
        run: |
          echo "=== all zips ==="
          find . -name '*.zip' -not -path './.git/*' | head -50
          echo "=== build-autorun ==="
          ls -la horizon-wine/build-autorun 2>/dev/null || echo "(missing)"
          echo "=== build dirs ==="
          ls -d horizon-wine/build-* 2>/dev/null || true
          mkdir -p out
          ZIP=$(find . -name 'autorun-*.zip' -not -path './.git/*' | head -1)
          if [ -z "$ZIP" ]; then echo "::error::build produced no autorun zip"; exit 1; fi
          echo "using $ZIP"
          unzip -o "$ZIP" 'switch/wine/wine-nx-runtime.nro' -d out
          ls -l out/switch/wine/

      - name: Upload runtime
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wine-nx-runtime-nro
          path: out/switch/wine/wine-nx-runtime.nro

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            horizon-wine/build-autorun/*.zip
          if-no-files-found: warn
